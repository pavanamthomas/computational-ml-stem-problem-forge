[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "problemforge"
version = "0.1.0"
description = "Computational laboratory for original ML/statistical/STEM problems with independent ground-truth verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dr. Pavanam Thomas", email = "thomaspavanam@gmail.com" },
]
keywords = [
    "machine-learning",
    "ground-truth",
    "validation",
    "leakage",
    "nested-cv",
    "numerical-stability",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/pavanamthomas/computational-ml-stem-problem-forge"
Repository = "https://github.com/pavanamthomas/computational-ml-stem-problem-forge"

[project.scripts]
problemforge = "problemforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "problems"]
python_files = ["test_*.py"]
addopts = "-q"
